name: Build Bubu Cast APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build phone APK (app)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build TV receiver APK (tv)
        run: ./gradlew :tv:assembleDebug --stacktrace

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: bubu-cast-phone
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload TV receiver APK
        uses: actions/upload-artifact@v4
        with:
          name: bubu-cast-tv
          path: tv/build/outputs/apk/debug/tv-debug.apk
